# Global security & SEO headers
[[headers]]
  for = "/*"
  [headers.values]
    Link = "<https://www.curiouskaizer.com/sitemap.xml>; rel=\"sitemap\""

    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# HTML pages - CDN edge cache 1hr, stale-while-revalidate 24hr (CRITICAL for Core Web Vitals)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

# Blog posts - cache 24hr, stale-while-revalidate 7 days
[[headers]]
  for = "/blog-*"
  [headers.values]
    Cache-Control = "public, s-maxage=86400, stale-while-revalidate=604800"

# CSS & JS - immutable, 1 year (versioned with ?v= query param)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images - cache 30 days
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Videos - cache 7 days
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Static assets - cache 7 days
[[headers]]
  for = "/(favicon.ico|apple-touch-icon.png|favicon-*.png|site.webmanifest)"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sitemap, robots, llms.txt - cache 1hr
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, s-maxage=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, s-maxage=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, s-maxage=3600"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/analytics"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, nosnippet"

[[headers]]
  for = "/analytics.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, nosnippet"

[[headers]]
  for = "/analytics-deploy/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, nosnippet"

[[headers]]
  for = "/404"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, nosnippet"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, nosnippet"
